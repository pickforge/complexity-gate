<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-label="PickCheck stop hook mock">
  <title>PICKCHECK · STOP HOOK</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="720" rx="14"/></clipPath>
  </defs>

  <!-- window frame -->
  <rect width="1200" height="720" rx="14" fill="#0A0A0B"/>
  <rect x="0.5" y="0.5" width="1199" height="719" rx="13.5" stroke="#F2F2F3" stroke-opacity="0.14"/>

  <g clip-path="url(#frame)">
    <!-- chrome -->
    <circle cx="28" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="46" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <circle cx="64" cy="24" r="5" fill="#F2F2F3" fill-opacity="0.15"/>
    <text x="92" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#6E6E75">PICKCHECK · STOP HOOK</text>
    <g>
      <rect x="1004" y="12" width="172" height="24" rx="12" fill="#FF7A1A" fill-opacity="0.05" stroke="#FF7A1A" stroke-opacity="0.3"/>
      <circle cx="1020" cy="24" r="3" fill="#FF7A1A" fill-opacity="0.7"/>
      <text x="1030" y="28" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#FF7A1A" fill-opacity="0.7">STOP BLOCKED 1/3</text>
    </g>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#F2F2F3" stroke-opacity="0.08"/>

    <!-- ===== terminal pane ===== -->
    <rect x="24" y="72" width="560" height="430" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="44" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">TERMINAL</text>
    <text x="564" y="100" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">~/app · git HEAD</text>
    <rect x="40" y="116" width="528" height="370" rx="6" fill="#000000" fill-opacity="0.4" stroke="#F2F2F3" stroke-opacity="0.05"/>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12.5" xml:space="preserve">
      <text x="56" y="150" fill="#F2F2F3">$ pickcheck check --changed</text>
      <text x="56" y="180" fill="#F2F2F3" fill-opacity="0.85">FAIL 1 changed file, 1 function, 1 violation</text>
      <text x="56" y="204" fill="#F2F2F3" fill-opacity="0.85">FAIL src/auth.ts  1 function, 1 violation</text>
      <text x="56" y="228" fill="#6E6E75">DETAILS pickcheck check --changed --verbose &lt;file&gt;</text>
      <text x="56" y="252" fill="#6E6E75">exit 1</text>
      <text x="56" y="298" fill="#F2F2F3">$ pickcheck check --changed --verbose src/auth.ts</text>
      <text x="56" y="328" fill="#F2F2F3" fill-opacity="0.85">FAIL src/auth.ts:42 authenticate  complexity 18 &gt; 15</text>
      <text x="56" y="352" fill="#6E6E75">exit 1</text>
      <rect x="56" y="386" width="8" height="16" fill="#F2F2F3" fill-opacity="0.6"/>
    </g>

    <!-- ===== metrics pane ===== -->
    <rect x="608" y="72" width="568" height="430" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="628" y="100" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">FUNCTION METRICS</text>
    <text x="1156" y="100" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">src/auth.ts:42 authenticate</text>

    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">
      <text x="644" y="140">METRIC</text>
      <text x="930" y="140" text-anchor="end">VALUE</text>
      <text x="1030" y="140" text-anchor="end">LIMIT</text>
      <text x="1140" y="140" text-anchor="end">STATUS</text>
    </g>
    <line x1="628" y1="154" x2="1156" y2="154" stroke="#F2F2F3" stroke-opacity="0.08"/>

    <!-- complexity row: over the limit -->
    <rect x="628" y="164" width="528" height="40" rx="6" fill="#FF7A1A" fill-opacity="0.06" stroke="#FF7A1A" stroke-opacity="0.25"/>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#FF7A1A" fill-opacity="0.7">
      <text x="644" y="189">complexity</text>
      <text x="930" y="189" text-anchor="end">18</text>
      <text x="1030" y="189" text-anchor="end">15</text>
      <text x="1140" y="189" text-anchor="end">FAIL</text>
    </g>

    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#F2F2F3" fill-opacity="0.7">
      <text x="644" y="243">depth</text>
      <text x="930" y="243" text-anchor="end">3</text>
      <text x="1030" y="243" text-anchor="end">4</text>
      <text x="644" y="291">lines</text>
      <text x="930" y="291" text-anchor="end">64</text>
      <text x="1030" y="291" text-anchor="end">100</text>
      <text x="644" y="339">params</text>
      <text x="930" y="339" text-anchor="end">2</text>
      <text x="1030" y="339" text-anchor="end">6</text>
      <text x="644" y="387">bool_ops</text>
      <text x="930" y="387" text-anchor="end">2</text>
      <text x="1030" y="387" text-anchor="end">3</text>
    </g>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="13" fill="#6E6E75" text-anchor="end">
      <text x="1140" y="243">ok</text>
      <text x="1140" y="291">ok</text>
      <text x="1140" y="339">ok</text>
      <text x="1140" y="387">ok</text>
    </g>
    <g stroke="#F2F2F3" stroke-opacity="0.05">
      <line x1="628" y1="264" x2="1156" y2="264"/>
      <line x1="628" y1="312" x2="1156" y2="312"/>
      <line x1="628" y1="360" x2="1156" y2="360"/>
    </g>

    <line x1="628" y1="420" x2="1156" y2="420" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">
      <text x="628" y="448">TREE-SITTER · NO EXTERNAL LINTERS · NO MODEL COUNTING</text>
      <text x="628" y="472">ONLY FUNCTIONS TOUCHED BY THE GIT DIFF</text>
    </g>

    <!-- ===== hook loop: two events merge into one decision ===== -->
    <rect x="24" y="526" width="1152" height="170" rx="10" fill="#0F0F11" stroke="#F2F2F3" stroke-opacity="0.08"/>
    <text x="44" y="552" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75">HOOK LOOP</text>
    <text x="1156" y="552" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.8" fill="#6E6E75" fill-opacity="0.7">pickcheck hook claude</text>

    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">
      <rect x="44" y="566" width="232" height="32" rx="16" fill="#F2F2F3" fill-opacity="0.05" stroke="#F2F2F3" stroke-opacity="0.1"/>
      <text x="160" y="586" text-anchor="middle" fill="#F2F2F3" fill-opacity="0.75">PostToolUse · Edit</text>
      <rect x="44" y="622" width="232" height="32" rx="16" fill="#F2F2F3" fill-opacity="0.05" stroke="#F2F2F3" stroke-opacity="0.1"/>
      <text x="160" y="642" text-anchor="middle" fill="#F2F2F3" fill-opacity="0.75">Stop · check --changed</text>
    </g>
    <path d="M276 582 H330 L370 610 L330 638 H276 M370 610 H522" stroke="#F2F2F3" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <circle cx="532" cy="610" r="7" fill="#FF7A1A"/>

    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">
      <rect x="560" y="594" width="232" height="32" rx="16" fill="#F2F2F3" fill-opacity="0.05" stroke="#F2F2F3" stroke-opacity="0.1"/>
      <text x="676" y="614" text-anchor="middle" fill="#F2F2F3" fill-opacity="0.75">decision: block</text>
      <text x="822" y="614" text-anchor="middle" fill="#6E6E75">→</text>
      <rect x="852" y="594" width="304" height="32" rx="16" fill="#F2F2F3" fill-opacity="0.05" stroke="#F2F2F3" stroke-opacity="0.1"/>
      <text x="1004" y="614" text-anchor="middle" fill="#F2F2F3" fill-opacity="0.75">fix · clean Stop resets counter</text>
    </g>

    <g font-family="Geist Mono, JetBrains Mono, monospace" font-size="10" letter-spacing="1.4" fill="#6E6E75" fill-opacity="0.7">
      <text x="44" y="682">CLAUDE CODE · CODEX · CURSOR · GROK · PI · OMP · OPENCODE</text>
      <text x="1156" y="682" text-anchor="end">REASON: Fix the listed files, then finish.</text>
    </g>
  </g>
</svg>
